seed: 1024
device: auto
torch_num_threads: 1

model:
  hidden_dim: 256
  num_layers: 3
  use_gru: true

training:
  batch_size: 128
  updates: 16000
  smoke_updates: 120
  train_sequence_length: 112
  learning_rate: 3.0e-4
  grad_clip_norm: 3.0
  eval_every: 400
  smoke_eval_every: 20
  val_horizon: 200
  max_val_windows: 256
  checkpoint_metric: val/VPT80@0.25
  checkpoint_mode: max

loss:
  one_step_weight: 0.8
  rollout_weight: 2.7
  rollout_train_horizon: 55
  rollout_tail_weight: 1.5
  rollout_hard_fraction: 0.0
  rollout_hard_weight: 0.0
  vpt_focus_horizon: 20
  vpt_margin: 0.22
  vpt_weight: 0.30
  stability_bound: 3.0
  stability_weight: 0.05

eval:
  warmup_steps: 10
  horizon: auto
  max_horizon: 1000
  report_horizons: [1, 5, 10, 90, 100, 200, 500, 1000]
  vpt_thresholds: [0.10, 0.25, 0.50]
