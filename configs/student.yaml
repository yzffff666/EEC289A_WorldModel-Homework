seed: 1024
device: auto
torch_num_threads: 1

model:
  hidden_dim: 256
  num_layers: 3
  use_gru: true

training:
  batch_size: 128
  updates: 14000
  smoke_updates: 120
  train_sequence_length: 128
  learning_rate: 3.0e-4
  grad_clip_norm: 3.0
  eval_every: 700
  smoke_eval_every: 20
  val_horizon: 200
  max_val_windows: 128
  checkpoint_metric: val/VPT80@0.25
  checkpoint_mode: max

loss:
  one_step_weight: 0.85
  rollout_weight: 2.6
  rollout_train_horizon: 52
  rollout_tail_weight: 1.3
  rollout_hard_fraction: 0.0
  rollout_hard_weight: 0.0
  rollout_num_starts: 2
  vpt_focus_horizon: 34
  vpt_margin: 0.22
  vpt_weight: 0.24
  vpt_hard_fraction: 0.25
  vpt_hard_weight: 0.12
  stability_bound: 3.0
  stability_weight: 0.055

eval:
  warmup_steps: 10
  horizon: auto
  max_horizon: 1000
  report_horizons: [1, 5, 10, 90, 100, 200, 500, 1000]
  vpt_thresholds: [0.10, 0.25, 0.50]
